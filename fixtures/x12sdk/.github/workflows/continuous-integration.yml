name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Lint
      run: |
        ruff check src
        ruff format --check src
    - name: Dependency licenses
      run: |
        pip install pip-licenses
        pip-licenses --from=mixed --fail-on="GNU General Public License v2 (GPLv2);GNU General Public License v3 (GPLv3);GNU Affero General Public License v3 (AGPLv3);GNU Lesser General Public License v3 (LGPLv3);UNKNOWN"
    - name: Test
      run: pytest --cov --cov-report=term-missing --cov-fail-under=90
    - name: CLI smoke test
      run: |
        for f in demo-file/demo.*; do
          x12sdk -m -p "$f" > /dev/null
        done
